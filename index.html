```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stock Management System</title>

    <!-- PWA -->
    <link rel="manifest"
          href="/static/pwa/manifest.json">

    <meta name="theme-color"
          content="#0f172a">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="Stock Manager">

    <link rel="stylesheet"
          href="/style.css">

</head>

<body>

    <div class="container">

        <!-- LOGIN -->

        <div class="card" id="loginCard">

            <div class="logo">
                &#128230;
            </div>

            <h1>Stock Management</h1>

            <p class="subtitle">
                Welcome back
            </p>


            <!-- PWA INSTALL -->

            <div id="pwaInstallCard"
                 style="display:none;">

                <div class="pwa-install-icon">
                    &#128230;
                </div>

                <div class="pwa-install-content">

                    <strong>
                        Install Stock Manager
                    </strong>

                    <span>
                        Install the app for faster access.
                    </span>

                </div>

                <button
                    type="button"
                    id="installStockAppBtn"
                    class="pwa-install-button">

                    INSTALL APP

                </button>

            </div>


            <form id="loginForm">

                <label for="loginUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>

                <div class="password-wrapper">

                    <span class="password-lock"
                          aria-hidden="true">&#128274;</span>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleLoginPassword"
                        aria-label="Show password">

                        &#128065;

                    </button>

                </div>


                <button
                    type="submit"
                    class="main-button">

                    LOGIN

                </button>

            </form>


            <p class="switch">

                Don't have an account?

                <button
                    type="button"
                    id="showRegister">

                    CREATE ACCOUNT

                </button>

            </p>

        </div>


        <!-- REGISTER -->

        <div class="card hidden" id="registerCard">

            <div class="logo">
                &#128230;
            </div>

            <h1>Stock Management</h1>

            <p class="subtitle">
                Create your account
            </p>


            <form id="registerForm">

                <label for="registerUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose username"
                    autocomplete="username"
                    required
                >


                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    autocomplete="new-password"
                    required
                >


                <label for="registerConfirm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="registerConfirm"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="submit"
                    class="main-button">

                    REGISTER

                </button>

            </form>


            <p class="switch">

                Already have an account?

                <button
                    type="button"
                    id="showLogin">

                    BACK TO LOGIN

                </button>

            </p>

        </div>

    </div>


    <!-- Main JavaScript -->

    <script src="/script.js"></script>


    <!-- PWA SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker.register(
                    "/service-worker.js"
                )
                .then(function (registration) {

                    console.log(
                        "Stock Manager service worker registered.",
                        registration.scope
                    );

                })
                .catch(function (error) {

                    console.error(
                        "Service worker registration failed:",
                        error
                    );

                });

            });

        }

    </script>

</body>

</html>
```
